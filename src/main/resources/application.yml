server:
  port: 8081

spring:
  application:
    name: weather
  datasource:
    url: jdbc:postgresql://localhost:5432/weather_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  cache:
    type: redis
  threads:
    virtual:
      enabled: true

app:
  weather:
    owm:
      api-key: ${OWM_API_KEY:}
      base-url: https://api.openweathermap.org

jwt:
  secret: ${JWT_SECRET:defaultFallbackSecretKeyHereThatIsLongEnough32Bytes}
  expiration: ${JWT_EXPIRATION:86400000}